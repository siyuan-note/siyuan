version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /kernel
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      go-x:
        patterns:
          - "golang.org/x/*"
      google:
        patterns:
          - "google.golang.org/*"
    ignore:
      # 由维护者 fork 提供，replace 指向 88250/*，不跟随上游版本
      - dependency-name: "github.com/mattn/go-sqlite3"
      - dependency-name: "github.com/pdfcpu/pdfcpu"
