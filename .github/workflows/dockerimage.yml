name: Release Docker Image

on:
  push:
    tags:
      - 'v*'
      - '!*alpha*'
      - '!*beta*'
      - '!*rc*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to build, without the v prefix'
        required: true
        type: string
      verify_cache:
        description: 'Run cold and warm ONNX cache acceptance (slow)'
        default: false
        type: boolean

concurrency:
  group: siyuan-docker-release
  cancel-in-progress: false
  queue: max

env:
  package_json: "app/package.json"
  docker_hub_owner: "b3log"
  docker_hub_repo: "siyuan"

jobs:
  build:
    if: ${{ github.repository_owner == 'siyuan-note' }}
    name: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          # 手动重建使用正式版标签的源码，避免混入工作流分支上的后续开发内容。
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.sha }}
          path: source
          submodules: recursive

      - name: Checkout Docker build configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: docker-config
          sparse-checkout: |
            Dockerfile
            .dockerignore
            scripts/verify-docker-release.py
            scripts/check-docker-cache.py
            scripts/test_docker_release.py
            scripts/testdata/docker-ocr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Extract version from package.json
        id: version
        run: |
          echo "value=$(jq .version ${{ env.package_json }} -r)" >> $GITHUB_OUTPUT

      - name: Verify release version matches package.json
        # 标签触发时校验标签，手动触发时校验指定版本，两种方式均只发布正式版。
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version without a v prefix, stopping"
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version ($VERSION) does not match package.json ($PACKAGE_VERSION), stopping"
            exit 1
          fi
          echo "Release version matches package.json: $VERSION"

      - name: Apply Docker build configuration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # 只更新工作流提交中的构建配置，应用源码和资源保持正式版标签的内容。
        run: |
          cp ../docker-config/Dockerfile Dockerfile
          cp ../docker-config/.dockerignore .dockerignore

      - name: Record source and build configuration
        run: |
          echo "Source commit: $(git rev-parse HEAD)"
          sha256sum Dockerfile .dockerignore

      - name: Test Docker release verification
        run: python3 -m unittest discover -s ../docker-config/scripts -p test_docker_release.py

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build candidate image and export cache
        id: build
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ env.docker_hub_owner }}/${{ env.docker_hub_repo }}
          CACHE_IMAGE: ${{ env.docker_hub_owner }}/${{ env.docker_hub_repo }}:buildcache-release-v1
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v8 \
            --cache-from "type=registry,ref=$CACHE_IMAGE" \
            --cache-to "type=registry,ref=$CACHE_IMAGE,mode=max" \
            --metadata-file "$RUNNER_TEMP/docker-metadata.json" --progress plain \
            -t "$IMAGE_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" . \
            2>&1 | tee "$RUNNER_TEMP/docker-build.log"
          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/docker-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Missing candidate image digest"
            exit 1
          fi
          echo "image=$IMAGE_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify all release platforms and OCR
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.image }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 ../docker-config/scripts/verify-docker-release.py verify \
            --image "$RELEASE_IMAGE" --version "$RELEASE_VERSION" \
            --report "$RUNNER_TEMP/docker-verification.json"

      - name: Verify ONNX cache reuse and invalidation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_cache }}
        env:
          CACHE_REPOSITORY: ${{ env.docker_hub_owner }}/${{ env.docker_hub_repo }}
        run: |
          python3 ../docker-config/scripts/check-docker-cache.py \
            --dockerfile Dockerfile --cache-repository "$CACHE_REPOSITORY" \
            --records "$RUNNER_TEMP/docker-cache-acceptance"

      - name: Publish verified release image
        env:
          RELEASE_IMAGE: ${{ steps.build.outputs.image }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 ../docker-config/scripts/verify-docker-release.py promote \
            --image "$RELEASE_IMAGE" --version "$RELEASE_VERSION" \
            --report "$RUNNER_TEMP/docker-verification.json"

      - name: Preserve build and verification records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docker-build.log
            ${{ runner.temp }}/docker-metadata.json
            ${{ runner.temp }}/docker-verification.json
            ${{ runner.temp }}/docker-cache-acceptance
          if-no-files-found: ignore
