name: npm-cli-publish

on:
  push:
    tags:
      - "npm-cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: scripts/npm-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/npm-cli-v')
        run: |
          PKG_VERSION="npm-cli-v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package version ${PKG_VERSION}" >&2
            exit 1
          fi
      - name: Verify launcher
        run: node bin/siyuan.js --help
      - name: Publish
        run: npm publish --access public --provenance
