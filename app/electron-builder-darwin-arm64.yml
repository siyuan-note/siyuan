productName: "Jitang Notes"
appId: "io.github.jitang-open.jitang-notes"
publish: null
asar: false
compression: "normal"
copyright: "© 2020-present SiYuan contributors; Jitang Notes modifications © 2026 jitang-open"
artifactName: "jitang-notes-${version}-${os}-arm64.${ext}"
extraMetadata:
  main: "electron/main.js"
directories:
  output: "build"
files:
  - "electron"
afterPack: "./scripts/afterPack.js"
extraFiles:
  - from: "../LICENSE"
    to: "Resources/LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "Resources/THIRD_PARTY_NOTICES.md"

mac:
  identity: null
  icon: "src/assets/icon.icns"
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: "../../entitlements.mas.plist"
  extendInfo:
    - NSMicrophoneUsageDescription: "This app requires microphone access to record audio."
  entitlementsInherit: "../../entitlements.mas.plist"
  minimumSystemVersion: "12.0.0"
  protocols:
    - name: "Jitang Notes"
      schemes:
        - "siyuan"
  extraResources:
    - from: "kernel-darwin-arm64"
      to: "kernel"
  target:
    - target: "dmg"
      arch: "arm64"

extraResources:
  - from: "changelogs"
    to: "changelogs"
  - from: "stage"
    to: "stage"
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
  - from: "pandoc/pandoc-darwin-arm64.zip"
    to: "pandoc.zip"
  - from: "pandoc/pandoc-resources"
    to: "pandoc-resources"
    filter: "!**/{.DS_Store}"
