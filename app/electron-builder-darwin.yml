extends: "./electron-builder-common.yml"
productName: "SiYuan"
appId: "org.b3log.siyuan"
publish: null
asar: false
compression: "normal"
copyright: "© 2020-present Yunnan Liandi Technology Co., Ltd."
artifactName: "siyuan-${version}-${os}.${ext}"
extraMetadata:
  main: "electron-dist/main.js"
directories:
  output: "build"
files:
  - "electron-dist"
afterPack: "./scripts/afterPack.js"
beforePack: "./scripts/beforePack.js"
extraFiles:
  - from: "../LICENSE"
    to: "Resources/LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "Resources/THIRD_PARTY_NOTICES.md"

mac:
  sign: "./scripts/sign-darwin.js"
  identity: "Yunnan Liandi Technology Co., Ltd."
  provisioningProfile: "../../SiYuan.provisionprofile"
  icon: "src/assets/icon.icns"
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: "../../entitlements.mas.plist"
  extendInfo:
    NSMicrophoneUsageDescription: "This app requires microphone access to record audio."
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: "net.daringfireball.markdown"
        UTTypeConformsTo: ["public.plain-text"]
        UTTypeTagSpecification:
          public.filename-extension: ["md", "markdown"]
          public.mime-type: ["text/markdown"]
  entitlementsInherit: "../../entitlements.mas.plist"
  minimumSystemVersion: "12.0.0"
  protocols:
    - name: "SiYuan"
      schemes:
        - "siyuan"
  extraResources:
    - from: "kernel-darwin"
      to: "kernel"
  target:
    - target: "dmg"
      arch: "x64"

extraResources:
  - from: "changelogs"
    to: "changelogs"
    filter: ["v${version}/**"]
  - from: "stage"
    to: "stage"
    filter: ["**/*", "!ocr/runtime/**/*"]
  - from: "stage/ocr/runtime/darwin-amd64"
    to: "stage/ocr/runtime/darwin-amd64"
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
  - from: "pandoc/pandoc-darwin-amd64.zip"
    to: "pandoc.zip"
  - from: "pandoc/pandoc-resources"
    to: "pandoc-resources"
    filter: "!**/{.DS_Store}"
