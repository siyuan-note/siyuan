<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-mode="light" data-font-size="14">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/controls.css">
    <link rel="stylesheet" href="/menu.css">
    <script defer src="/menu.js"></script>
    <title></title>
</head>
<body>
    <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <symbol id="iconOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/><path d="m21 3-9 9"/><path d="M15 3h6v6"/>
        </symbol>
        <symbol id="iconFile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/>
        </symbol>
    </svg>
    <section id="menu" class="b3-menu av-records-panel map-unplaced-menu" role="dialog" aria-labelledby="title">
        <header class="av-records-panel-head"><span id="title" class="b3-menu__label"></span><span id="count" class="counter counter--bg"></span></header>
        <div class="av-records-panel-search"><input id="search" class="b3-text-field" type="search" maxlength="256"></div>
        <div id="rows" class="b3-menu__items av-records-panel-list" role="group"></div>
        <div id="status" class="av-records-panel-empty" role="status" aria-live="polite" hidden></div>
        <footer><button id="previous" class="b3-button b3-button--cancel" type="button" hidden></button><button id="more" class="b3-button b3-button--cancel" type="button" hidden></button><button id="close" class="b3-button b3-button--cancel" type="button"></button></footer>
    </section>
</body>
</html>
